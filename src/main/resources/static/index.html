<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Trayectos y Vehículos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 400px; width: 100%; border-radius: 8px; margin-top: 15px; }
    </style>
</head>
<body class="bg-light">

<div class="container my-4">
    <h2 class="text-center text-primary mb-4">Gestión y Consulta de Trayectos</h2>

    <div class="card mb-4 shadow-sm">
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label font-weight-bold">Buscar por Código de Ruta:</label>
                    <div class="input-group">
                        <input type="text" id="inputRuta" class="form-control" placeholder="Ej: RUTA01">
                        <button class="btn btn-primary" onclick="consultarPorRuta()">Buscar</button>
                    </div>
                </div>
                <div class="col-md-4">
                    <label class="form-label font-weight-bold">Rutas por Cédula Conductor:</label>
                    <div class="input-group">
                        <input type="text" id="inputConductor" class="form-control" placeholder="Ej: 123456789">
                        <button class="btn btn-secondary" onclick="consultarPorConductor()">Buscar</button>
                    </div>
                </div>
                <div class="col-md-4">
                    <label class="form-label font-weight-bold">Ruta y Conductor por Placa:</label>
                    <div class="input-group">
                        <input type="text" id="inputPlaca" class="form-control" placeholder="Ej: ABC123">
                        <button class="btn btn-info text-white" onclick="consultarPorPlaca()">Buscar</button>
                    </div>
                </div>
            </div>
            <div class="mt-3">
                <button class="btn btn-warning" onclick="consultarInhabilitados()">Ver Rutas Inhabilitadas</button>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-white font-weight-bold">Resultados de la Consulta</div>
                <div class="card-body">
                    <div id="resultadoTexto" class="alert alert-info">Ingrese un criterio de búsqueda.</div>
                    <ul id="listaResultados" class="list-group list-group-flush mb-3"></ul>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-white font-weight-bold">Visualización Geográfica</div>
                <div class="card-body p-2">
                    <div id="map"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    let map = L.map('map').setView([4.43889, -75.23222], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
    }).addTo(map);

    let markers = [];
    let currentPolyline = null;

    function limpiarMapa() {
        markers.forEach(m => map.removeLayer(m));
        markers = [];
        if (currentPolyline) {
            map.removeLayer(currentPolyline);
            currentPolyline = null;
        }
    }

    function consultarPorRuta() {
        const codigo = document.getElementById('inputRuta').value.trim();
        if (!codigo) return alert('Ingrese un código de ruta');

        fetch(`/api/trayectos/ruta/${codigo}`)
            .then(res => {
                if (!res.ok) throw new Error('Error al obtener datos');
                return res.text();
            })
            .then(text => {
                const data = text ? JSON.parse(text) : [];
                limpiarMapa();
                const lista = document.getElementById('listaResultados');
                lista.innerHTML = '';

                if (!data || data.length === 0) {
                    document.getElementById('resultadoTexto').className = 'alert alert-warning';
                    document.getElementById('resultadoTexto').innerText = `No se encontraron trayectos para la ruta: ${codigo}`;
                    return;
                }

                document.getElementById('resultadoTexto').className = 'alert alert-info';
                document.getElementById('resultadoTexto').innerText = `Trayectos encontrados para la ruta: ${codigo}`;

                let latlngs = [];
                data.forEach(t => {
                    lista.innerHTML += `<li class="list-group-item">Parada ${t.ordenParada || ''}: ${t.ubicacion || 'Ubicación registrada'}</li>`;
                    if (t.latitud && t.longitud) {
                        let marker = L.marker([t.latitud, t.longitud])
                            .addTo(map)
                            .bindPopup(`<b>Parada ${t.ordenParada || ''}</b><br>${t.ubicacion || ''}`);
                        markers.push(marker);
                        latlngs.push([t.latitud, t.longitud]);
                    }
                });

                if (latlngs.length > 0) {
                    currentPolyline = L.polyline(latlngs, {color: 'blue'}).addTo(map);
                    map.fitBounds(latlngs);
                }
            })
            .catch(err => {
                console.error(err);
                alert('No hay registros guardados para esa ruta en la base de datos.');
            });
    }

    function consultarPorConductor() {
        const id = document.getElementById('inputConductor').value.trim();
        if (!id) return alert('Ingrese la cédula del conductor');

        fetch(`/api/trayectos/conductor/${id}`)
            .then(res => res.text())
            .then(text => {
                const data = text ? JSON.parse(text) : [];
                const lista = document.getElementById('listaResultados');
                lista.innerHTML = '';
                if (!data || data.length === 0) {
                    document.getElementById('resultadoTexto').className = 'alert alert-warning';
                    document.getElementById('resultadoTexto').innerText = `No se encontraron rutas para el conductor ${id}`;
                    return;
                }
                document.getElementById('resultadoTexto').className = 'alert alert-info';
                document.getElementById('resultadoTexto').innerText = `Rutas asignadas al conductor ${id}:`;
                data.forEach(r => {
                    lista.innerHTML += `<li class="list-group-item">Código de Ruta: <b>${r}</b></li>`;
                });
            })
            .catch(() => alert('No se encontraron registros para este conductor.'));
    }

    function consultarPorPlaca() {
        const placa = document.getElementById('inputPlaca').value.trim();
        if (!placa) return alert('Ingrese una placa');

        fetch(`/api/trayectos/vehiculo/${placa}`)
            .then(res => res.text())
            .then(text => {
                const data = text ? JSON.parse(text) : [];
                const lista = document.getElementById('listaResultados');
                lista.innerHTML = '';
                if (!data || data.length === 0) {
                    document.getElementById('resultadoTexto').className = 'alert alert-warning';
                    document.getElementById('resultadoTexto').innerText = `No se encontraron registros para la placa ${placa}`;
                    return;
                }
                document.getElementById('resultadoTexto').className = 'alert alert-info';
                document.getElementById('resultadoTexto').innerText = `Resultados para el vehículo ${placa}:`;
                data.forEach(item => {
                    lista.innerHTML += `<li class="list-group-item">Ruta: <b>${item[0]}</b> | Conductor ID: <b>${item[1]}</b></li>`;
                });
            })
            .catch(() => alert('No se encontraron registros para esta placa.'));
    }

    function consultarInhabilitados() {
        fetch('/api/trayectos/inhabilitados')
            .then(res => res.text())
            .then(text => {
                const data = text ? JSON.parse(text) : [];
                const lista = document.getElementById('listaResultados');
                lista.innerHTML = '';
                if (!data || data.length === 0) {
                    document.getElementById('resultadoTexto').className = 'alert alert-warning';
                    document.getElementById('resultadoTexto').innerText = `No hay trayectos inhabilitados actualmente.`;
                    return;
                }
                document.getElementById('resultadoTexto').className = 'alert alert-info';
                document.getElementById('resultadoTexto').innerText = `Trayectos con conductor/vehículo inhabilitado:`;
                data.forEach(t => {
                    lista.innerHTML += `<li class="list-group-item text-danger">Ruta: ${t.codigoRuta} - Conductor RO/Vehículo inhabilitado</li>`;
                });
            })
            .catch(() => alert('Error al consultar rutas inhabilitadas.'));
    }
</script>
</body>
</html>
